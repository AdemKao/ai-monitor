[package]
name = "ai-monitor"
version = "0.3.2"
edition = "2024"
description = "Unified local usage monitor for AI coding tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdemKao/ai-monitor"
readme = "README.md"
keywords = ["ai", "codex", "opencode", "usage", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
self-replace = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
